- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes

- name: Start and enable Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: Remove default Nginx config
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy SeaweedFS S3 proxy config
  ansible.builtin.template:
    src: nginx_s3.conf.j2
    dest: /etc/nginx/sites-available/seaweedfs-s3.conf
    mode: '0644'
  notify: restart nginx

- name: Enable SeaweedFS S3 proxy site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/seaweedfs-s3.conf
    dest: /etc/nginx/sites-enabled/seaweedfs-s3.conf
    state: link
  notify: restart nginx