---
- name: Check if SeaweedFS binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/weed
  register: weed_bin

- name: Create temporary extraction directory
  ansible.builtin.file:
    path: /tmp/seaweed_extract
    state: directory
    mode: '0755'
  when: not weed_bin.stat.exists

# Скачиваем на control node — arch определяется автоматически через ansible_architecture
- name: Download SeaweedFS on controller (arch={{ seaweedfs_arch }})
  ansible.builtin.get_url:
    url: "{{ seaweedfs_download_url }}"
    dest: /tmp/seaweedfs.tar.gz
    mode: '0644'
  delegate_to: localhost
  run_once: false
  when: not weed_bin.stat.exists

- name: Copy SeaweedFS archive to node
  ansible.builtin.copy:
    src: /tmp/seaweedfs.tar.gz
    dest: /tmp/seaweedfs.tar.gz
    mode: '0644'
  when: not weed_bin.stat.exists

- name: Extract SeaweedFS binary
  ansible.builtin.unarchive:
    src: /tmp/seaweedfs.tar.gz
    dest: /tmp/seaweed_extract
    remote_src: yes
  when: not weed_bin.stat.exists

- name: Install weed binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/seaweed_extract/weed
    dest: /usr/local/bin/weed
    mode: '0755'
    remote_src: yes
  when: not weed_bin.stat.exists

- name: Cleanup temporary files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/seaweedfs.tar.gz
    - /tmp/seaweed_extract
  when: not weed_bin.stat.exists

- name: Create working directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ seaweed_dir }}"
    - "{{ seaweed_data_dir }}"
