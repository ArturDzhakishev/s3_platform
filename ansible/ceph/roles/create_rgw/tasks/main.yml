- name: Create RADOS GW
  block: 
    - name: Generate RGW spec file
      ansible.builtin.template:
        src: rgw_spec.yml.j2
        dest: /tmp/rgw_{{ rgw_name }}.yml
        owner: "{{ ceph_ssh_user }}"
        group: "{{ ceph_ssh_user }}"
        mode: '0644'
      register: rgw_spec_file

    # Применяем ТОЛЬКО если файл изменился
    - name: Apply RGW spec
      ansible.builtin.shell: >
        cephadm shell -- ceph orch apply -i - < /tmp/rgw_{{ rgw_name }}.yml
      register: rgw_apply
      changed_when: false

    - name: Wait for Ceph cluster healthy before adding S3 user
      command: ceph health
      register: ceph_health
      until: "'HEALTH_OK' in ceph_health.stdout"
      retries: 30      # ждать до 10 минут
      delay: 20
      changed_when: false
      delegate_to: node-master

    - name: Wait for RGW daemon to be running
      command: ceph orch ps --daemon-type rgw
      register: rgw_check
      until: "'running' in rgw_check.stdout"
      retries: 20
      delay: 15
      changed_when: false
      delegate_to: node-master
  when: inventory_hostname in groups['master']
  become: true