---
- name: Master bootstrap
  block:
    # ── Docker ───────────────────────────────────────────────────────────────
    - name: Add Docker repository (RedHat family)
      ansible.builtin.command: >
        dnf config-manager --add-repo
        https://download.docker.com/linux/centos/docker-ce.repo
      when:
        - ansible_os_family == 'RedHat'
        - ansible_pkg_mgr in ['dnf', 'yum']
      changed_when: false
      ignore_errors: true

    - name: Check if Docker is already installed
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_check

    - name: Install Docker
      ansible.builtin.package:
        name: "{{ pkgs_docker }}"
        state: present
      when: not docker_check.stat.exists

    - name: Enable and start Docker
      ansible.builtin.service:
        name: "{{ docker_service }}"
        state: started
        enabled: yes

    # ── Ceph base packages ────────────────────────────────────────────────────
    - name: Install Ceph base dependencies
      ansible.builtin.package:
        name: "{{ pkgs_ceph }}"
        state: present

    # ── Bootstrap ─────────────────────────────────────────────────────────────
    - name: Check if Ceph already bootstrapped
      ansible.builtin.stat:
        path: /etc/ceph/ceph.conf
      register: ceph_conf

    # Убрать --skip-pull в production
    - name: Bootstrap Ceph cluster using cephadm
      ansible.builtin.command: >
        cephadm bootstrap
        --mon-ip {{ ansible_host }}
        --skip-dashboard
        --skip-pull
        --ssh-user {{ ceph_ssh_user }}
      register: ceph_bootstrap
      when: not ceph_conf.stat.exists

    # ── Ceph public key ───────────────────────────────────────────────────────
    # Получаем ключ через cephadm — работает на всех ОС
    - name: Get Ceph Public Key via cephadm
      ansible.builtin.command: cephadm get-pub-key
      register: ceph_pub_key_cephadm
      changed_when: false
      failed_when: false

    # Fallback: читаем из файла если cephadm get-pub-key не поддерживается
    - name: Get Ceph Public Key from file (fallback)
      ansible.builtin.slurp:
        src: /etc/ceph/ceph.pub
      register: ceph_pub_key_file
      when: ceph_pub_key_cephadm.rc != 0
      failed_when: false

    - name: Set ceph_pub_key_content fact
      ansible.builtin.set_fact:
        ceph_pub_key_content: >-
          {{
            ceph_pub_key_cephadm.stdout
            if ceph_pub_key_cephadm.rc == 0
            else (ceph_pub_key_file.content | b64decode)
          }}

    - name: Save Ceph Public Key to /etc/ceph/ceph.pub
      ansible.builtin.copy:
        content: "{{ ceph_pub_key_content }}"
        dest: /etc/ceph/ceph.pub
        owner: "{{ ceph_ssh_user }}"
        group: "{{ ceph_ssh_user }}"
        mode: '0644'

  when: inventory_hostname in groups['master']
  become: true
