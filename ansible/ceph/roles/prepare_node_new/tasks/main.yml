---
- name: Prepare new worker nodes for Ceph scale
  block:
    - name: Add Docker repository (RedHat family)
      ansible.builtin.command: >
        dnf config-manager --add-repo
        https://download.docker.com/linux/centos/docker-ce.repo
      when:
        - ansible_os_family == 'RedHat'
        - ansible_pkg_mgr in ['dnf', 'yum']
      changed_when: false
      ignore_errors: true

    - name: Install base dependencies
      ansible.builtin.package:
        name: "{{ pkgs_base }}"
        state: present

    - name: Install Docker
      ansible.builtin.package:
        name: "{{ pkgs_docker }}"
        state: present

    - name: Enable and start Docker
      ansible.builtin.service:
        name: "{{ docker_service }}"
        state: started
        enabled: yes

    - name: Ensure /dev/sdb is not mounted
      ansible.builtin.shell: umount /dev/sdb* || true
      ignore_errors: true
      changed_when: false

    - name: Zap /dev/sdb using sgdisk
      ansible.builtin.command: sgdisk --zap-all /dev/sdb
      ignore_errors: true
      changed_when: false

    - name: Wipe filesystem signatures from /dev/sdb
      ansible.builtin.command: wipefs -a /dev/sdb
      ignore_errors: true
      changed_when: false

    - name: Overwrite beginning of /dev/sdb with zeros
      ansible.builtin.command: dd if=/dev/zero of=/dev/sdb bs=1M count=100
      ignore_errors: true
      changed_when: false

    - name: Ensure time sync daemon is running
      ansible.builtin.service:
        name: "{{ chrony_service }}"
        state: started
        enabled: yes

  when: inventory_hostname in groups['new_workers']
  become: true
