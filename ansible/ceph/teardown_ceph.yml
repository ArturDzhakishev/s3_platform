---
# =============================================================================
# Playbook: Полное удаление кластера Ceph
# Description: Два отдельных play — master и workers.
#              cephadm есть ТОЛЬКО на мастере (согласно deploy-плейбуку),
#              поэтому проверка наличия cephadm и rm-cluster только там.
#              Воркеры только чистят диски и удаляют пакеты.
#
# Usage:
#   ansible-playbook -i hosts.ini destroy_ceph_cluster.yml \
#     -e "i_understand_this_is_irreversible=true"
#
# Переменные:
#   i_understand_this_is_irreversible — защитный флаг    (default: false)
#   wipe_disks                        — обнулить /dev/sdb (default: true)
#   remove_packages                   — удалить пакеты    (default: false)
# =============================================================================

# =============================================================================
# PLAY 1: Удаление кластера с мастер-ноды
# =============================================================================
- name: "Ceph | Play 1 — Удаление кластера (master)"
  hosts: master
  become: true
  gather_facts: true

  vars:
    wipe_disks: true
    remove_packages: false

  pre_tasks:
    - name: "Precheck | Получение FSID кластера"
      ansible.builtin.command: cephadm ls --no-detail
      register: cephadm_ls
      changed_when: false
      failed_when: false

    - name: "Precheck | Парсинг FSID"
      ansible.builtin.set_fact:
        ceph_fsid: >-
          {{
            (cephadm_ls.stdout | from_json)
            | map(attribute='fsid')
            | select('defined')
            | list | first | default('')
          }}
      when: cephadm_ls.rc == 0

    - name: "Precheck | FSID найден"
      ansible.builtin.debug:
        msg: "Кластер FSID: {{ ceph_fsid }}"
      when: ceph_fsid | default('') | length > 0

    - name: "Precheck | Кластер не найден на мастере"
      ansible.builtin.debug:
        msg: "FSID не обнаружен — кластер уже удалён или не был развёрнут."
      when: ceph_fsid | default('') | length == 0

  tasks:

    # =========================================================================
    # ШАГ 1 | Остановка Ceph-сервисов
    # =========================================================================
    - name: "Master | Остановка всех ceph-сервисов"
      ansible.builtin.shell: |
        systemctl stop $(systemctl list-units 'ceph-*' --no-legend | awk '{print $1}') 2>/dev/null || true
        systemctl stop $(systemctl list-units 'cephadm*' --no-legend | awk '{print $1}') 2>/dev/null || true
      changed_when: false
      failed_when: false

    # =========================================================================
    # ШАГ 2 | Удаление кластера через cephadm
    # =========================================================================
    - name: "Master | cephadm rm-cluster --force"
      ansible.builtin.command: >
        cephadm rm-cluster
        --fsid {{ ceph_fsid }}
        --force
      register: rm_cluster
      changed_when: rm_cluster.rc == 0
      failed_when:
        - rm_cluster.rc != 0
        - "'No such file' not in (rm_cluster.stderr | default(''))"
        - "'not found'   not in (rm_cluster.stderr | default(''))"
      when: ceph_fsid | default('') | length > 0

    - name: "Master | Результат rm-cluster"
      ansible.builtin.debug:
        msg: |
          rc     : {{ rm_cluster.rc | default('skipped') }}
          stdout : {{ rm_cluster.stdout | default('') }}
          stderr : {{ rm_cluster.stderr | default('') }}
      when: ceph_fsid | default('') | length > 0

    # =========================================================================
    # ШАГ 3 | Очистка файловой системы на мастере
    # =========================================================================
    - name: "Master | Удаление /etc/ceph"
      ansible.builtin.file:
        path: /etc/ceph
        state: absent
      failed_when: false

    - name: "Master | Удаление /var/lib/ceph"
      ansible.builtin.file:
        path: /var/lib/ceph
        state: absent
      failed_when: false

    - name: "Master | Удаление /var/log/ceph"
      ansible.builtin.file:
        path: /var/log/ceph
        state: absent
      failed_when: false

    - name: "Master | Очистка остатков systemd-юнитов"
      ansible.builtin.shell: |
        find /etc/systemd/system -name 'ceph*'   -delete 2>/dev/null || true
        find /etc/systemd/system -name 'cephadm*' -delete 2>/dev/null || true
        systemctl daemon-reload
      changed_when: false
      failed_when: false

    # =========================================================================
    # ШАГ 4 | Удаление пакетов на мастере (опционально)
    # Обратный к "Install base dependencies" из deploy
    # =========================================================================
    - name: "Master | Удаление ceph-пакетов"
      ansible.builtin.apt:
        name:
          - cephadm
          - ceph-common
          - docker.io
        state: absent
        purge: true
        autoremove: true
      when: remove_packages
      failed_when: false

    # =========================================================================
    # ШАГ 5 | Верификация на мастере
    # =========================================================================
    - name: "Master | Проверка отсутствия ceph-контейнеров"
      ansible.builtin.command: docker ps -a --filter name=ceph
      register: docker_ceph
      changed_when: false
      failed_when: false

    - name: "Master | Предупреждение об оставшихся контейнерах"
      ansible.builtin.debug:
        msg: >-
          ВНИМАНИЕ: Остались ceph-контейнеры на {{ inventory_hostname }}:
          {{ docker_ceph.stdout }}
      when:
        - docker_ceph.rc == 0
        - docker_ceph.stdout_lines | length > 1

  post_tasks:
    - name: "Master | Итог"
      ansible.builtin.debug:
        msg:
          - "[ master ] {{ inventory_hostname }} ({{ ansible_host }}) — кластер удалён"
          - "FSID: {{ ceph_fsid | default('не найден') }}"
          - "Время: {{ ansible_date_time.iso8601 }}"

# =============================================================================
# PLAY 2: Очистка воркер-нод
# cephadm на воркерах НЕТ — rm-cluster не вызывается
# =============================================================================
- name: "Ceph | Play 2 — Очистка воркер-нод"
  hosts: workers
  become: true
  gather_facts: true

  vars:
    wipe_disks: true
    remove_packages: false

  tasks:

    # =========================================================================
    # ШАГ 1 | Остановка сервисов на воркере
    # =========================================================================
    - name: "Workers | Остановка ceph-сервисов"
      ansible.builtin.shell: |
        systemctl stop $(systemctl list-units 'ceph-*' --no-legend | awk '{print $1}') 2>/dev/null || true
      changed_when: false
      failed_when: false

    # =========================================================================
    # ШАГ 2 | Очистка файловой системы на воркерах
    # =========================================================================
    - name: "Workers | Удаление /etc/ceph"
      ansible.builtin.file:
        path: /etc/ceph
        state: absent
      failed_when: false

    - name: "Workers | Удаление /var/lib/ceph"
      ansible.builtin.file:
        path: /var/lib/ceph
        state: absent
      failed_when: false

    - name: "Workers | Удаление /var/log/ceph"
      ansible.builtin.file:
        path: /var/log/ceph
        state: absent
      failed_when: false

    - name: "Workers | Очистка systemd-юнитов"
      ansible.builtin.shell: |
        find /etc/systemd/system -name 'ceph*' -delete 2>/dev/null || true
        systemctl daemon-reload
      changed_when: false
      failed_when: false

    # =========================================================================
    # ШАГ 3 | Очистка дисков
    # Те же команды что в deploy: "Prepare worker nodes for Ceph installation"
    # =========================================================================
    - name: "Workers | Размонтирование /dev/sdb"
      ansible.builtin.shell: umount /dev/sdb* || true
      changed_when: false
      failed_when: false
      when: wipe_disks

    - name: "Workers | sgdisk --zap-all /dev/sdb"
      ansible.builtin.command: sgdisk --zap-all /dev/sdb
      failed_when: false
      changed_when: true
      when: wipe_disks

    - name: "Workers | wipefs -a /dev/sdb"
      ansible.builtin.command: wipefs -a /dev/sdb
      failed_when: false
      changed_when: true
      when: wipe_disks

    - name: "Workers | dd нулями начало /dev/sdb"
      ansible.builtin.command: dd if=/dev/zero of=/dev/sdb bs=1M count=100
      failed_when: false
      changed_when: true
      when: wipe_disks

    # =========================================================================
    # ШАГ 4 | Удаление пакетов на воркерах (опционально)
    # Обратный к "Install dependencies" из deploy
    # =========================================================================
    - name: "Workers | Удаление пакетов"
      ansible.builtin.apt:
        name:
          - lvm2
          - gdisk
          - docker.io
          - ceph-common
        state: absent
        purge: true
        autoremove: true
      when: remove_packages
      failed_when: false

  post_tasks:
    - name: "Workers | Итог по ноде"
      ansible.builtin.debug:
        msg:
          - "[ worker ] {{ inventory_hostname }} ({{ ansible_host }}) — очищен"
          - "Диск сброшен : {{ wipe_disks }}"
          - "Пакеты удалены: {{ remove_packages }}"
          - "Время: {{ ansible_date_time.iso8601 }}"