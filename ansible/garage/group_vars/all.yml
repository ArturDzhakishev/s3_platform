garage_version: "2.2.0"
garage_rpc_port: 3901

garage_meta_dir: /var/lib/garage/meta
garage_data_dir: /var/lib/garage/data

garage_replication_factor: 1

garage_rpc_secret: "{{ lookup('password', 'secrets/garage_rpc_secret.txt length=64 chars=hexdigits') }}"
garage_admin_token: "{{ lookup('password', 'secrets/garage_admin_token.txt length=32 chars=ascii_letters') }}"
garage_metrics_token: "{{ lookup('password', 'secrets/garage_metrics_token.txt length=32 chars=ascii_letters') }}"

garage_nodes_config:
  node1:
    zone: zone1
    capacity: 2G

  node2:
    zone: zone1
    capacity: 2G

  node3:
    zone: zone1
    capacity: 2G

  node4:
    zone: zone1
    capacity: 2G

name_bucket: test

# ── Архитектура для скачивания бинарника Garage ───────────────────────────────
# Определяется автоматически через ansible_architecture (из Gathering Facts)
#
# Garage публикует бинарники для musl (статическая линковка) —
# работает на любом Linux без зависимостей от glibc версии
#
# Полный список таргетов: https://garagehq.deuxfleurs.fr/_releases/
_garage_arch_map:
  x86_64:  "x86_64-unknown-linux-musl"
  aarch64: "aarch64-unknown-linux-musl"
  armv7l:  "armv6l-unknown-linux-musleabihf"
  armv6l:  "armv6l-unknown-linux-musleabihf"

garage_arch: "{{ _garage_arch_map[ansible_architecture] | default('x86_64-unknown-linux-musl') }}"

garage_download_url: >-
  https://garagehq.deuxfleurs.fr/_releases/v{{ garage_version }}/{{ garage_arch }}/garage

# ── Утилита для скачивания ────────────────────────────────────────────────────
# wget или curl — оба умеют скачивать, выбираем по наличию
# Ansible get_url не требует внешней утилиты, поэтому wget как зависимость убран
# Оставляем переменную для возможных кастомных сценариев
_dl_pkgs_debian: []   # get_url не требует wget
_dl_pkgs_redhat: []

dl_pkgs: "{{ _dl_pkgs_redhat if ansible_os_family == 'RedHat' else _dl_pkgs_debian }}"
