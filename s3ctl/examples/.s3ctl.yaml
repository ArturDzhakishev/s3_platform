# ~/.s3ctl.yaml — конфигурационный файл s3ctl
#
# Расположение:
#   ~/.s3ctl.yaml          — глобальный (домашняя директория)
#   ./.s3ctl.yaml          — локальный (текущая директория, имеет приоритет)
#
# Переменные окружения перекрывают файл:
#   S3CTL_API=http://192.168.1.100:8000

# URL бэкенда платформы
api_url: http://localhost:8000

